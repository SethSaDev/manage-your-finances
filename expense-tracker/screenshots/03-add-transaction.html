<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExpenseTracker — Add Transaction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple:#7c3aed; --purple-light:#ede9fe;
  --green:#059669; --green-light:#d1fae5;
  --red:#dc2626;
  --bg:#f5f3ff; --card:#fff; --text:#1e1b4b; --muted:#6b7280; --border:#e5e7eb;
  --shadow:0 4px 24px rgba(124,58,237,.08);
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); }
.header { background:linear-gradient(135deg,#7c3aed,#4f46e5); padding:0 40px; height:64px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 12px rgba(124,58,237,.3); }
.logo { color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; gap:10px; }
.logo-icon { width:32px; height:32px; background:rgba(255,255,255,.2); border-radius:8px; display:grid; place-items:center; }
.avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#60a5fa); border:2px solid rgba(255,255,255,.4); display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; }
.main { max-width:680px; margin:0 auto; padding:40px 24px; }
.page-title { font-size:26px; font-weight:800; letter-spacing:-.5px; margin-bottom:4px; }
.page-sub { color:var(--muted); font-size:14px; margin-bottom:32px; }

.form-card { background:var(--card); border-radius:20px; padding:36px 40px; box-shadow:var(--shadow); border:1px solid var(--border); }

.type-toggle { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:28px; }
.type-btn { padding:14px; border-radius:12px; border:2px solid var(--border); cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .2s; background:#fff; color:var(--muted); }
.type-btn.active-expense { border-color:var(--red); background:#fff5f5; color:var(--red); }
.type-btn.active-income  { border-color:var(--green); background:#f0fdf4; color:var(--green); }

.divider { height:1px; background:var(--border); margin:0 -40px 28px; }

.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.form-group { display:flex; flex-direction:column; gap:7px; }
.form-group.full { grid-column:1/-1; }
label { font-size:13px; font-weight:600; color:var(--text); }
.label-hint { font-size:11px; color:var(--muted); font-weight:400; margin-left:6px; }
input, select, textarea {
  padding:12px 16px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14px; font-family:inherit; color:var(--text); background:#fafafa;
  outline:none; transition:border .2s, box-shadow .2s;
}
input:focus, select:focus { border-color:var(--purple); background:#fff; box-shadow:0 0 0 3px rgba(124,58,237,.1); }
.input-prefix { position:relative; }
.input-prefix span { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:600; font-size:15px; }
.input-prefix input { padding-left:32px; }
.input-prefix input.expense-input { border-color:#fca5a5; background:#fff5f5; }
.category-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
.cat-btn { padding:10px 8px; border:1.5px solid var(--border); border-radius:10px; cursor:pointer; font-size:12px; font-weight:600; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px; background:#fff; color:var(--muted); transition:all .2s; }
.cat-btn.active { border-color:var(--purple); background:var(--purple-light); color:var(--purple); }
.cat-icon { font-size:20px; }

.form-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:28px; }
.btn-cancel { padding:14px; border:1.5px solid var(--border); border-radius:12px; background:#fff; font-size:15px; font-weight:600; cursor:pointer; color:var(--muted); font-family:inherit; }
.btn-submit { padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(124,58,237,.3); }

.quick-amounts { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.qa { padding:5px 12px; border:1.5px solid var(--border); border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; background:#fff; color:var(--muted); }
.qa:hover { border-color:var(--purple); color:var(--purple); }
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">💰</div>ExpenseTracker</div>
  <div class="avatar">AJ</div>
</div>

<div class="main">
  <div class="page-title">Add Transaction</div>
  <div class="page-sub">Record a new income or expense entry</div>

  <div class="form-card">

    <!-- Type toggle -->
    <div class="type-toggle">
      <button class="type-btn active-expense">💸 Expense</button>
      <button class="type-btn" style="color:var(--muted)">💵 Income</button>
    </div>

    <div class="divider"></div>

    <div class="form-grid">

      <div class="form-group full">
        <label>Description</label>
        <input type="text" placeholder="e.g. Grocery shopping at Walmart" value="Weekly Groceries" />
      </div>

      <div class="form-group">
        <label>Amount <span class="label-hint">(negative = expense)</span></label>
        <div class="input-prefix">
          <span>$</span>
          <input type="number" class="expense-input" value="127.40" step="0.01"/>
        </div>
        <div class="quick-amounts">
          <span class="qa">$10</span>
          <span class="qa">$25</span>
          <span class="qa">$50</span>
          <span class="qa">$100</span>
          <span class="qa">$500</span>
        </div>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input type="date" value="2026-04-09"/>
      </div>

      <div class="form-group full">
        <label>Category</label>
        <div class="category-grid">
          <button class="cat-btn active"><span class="cat-icon">🛒</span>Food</button>
          <button class="cat-btn"><span class="cat-icon">🚌</span>Transport</button>
          <button class="cat-btn"><span class="cat-icon">🏠</span>Housing</button>
          <button class="cat-btn"><span class="cat-icon">🎬</span>Entertain</button>
          <button class="cat-btn"><span class="cat-icon">💊</span>Health</button>
          <button class="cat-btn"><span class="cat-icon">🛍️</span>Shopping</button>
          <button class="cat-btn"><span class="cat-icon">💰</span>Income</button>
          <button class="cat-btn"><span class="cat-icon">📦</span>Other</button>
        </div>
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-cancel">Cancel</button>
      <button class="btn-submit">+ Add Transaction</button>
    </div>

  </div>
</div>
</body>
</html>
