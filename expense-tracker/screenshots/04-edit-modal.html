<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExpenseTracker — Edit Transaction</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple:#7c3aed; --purple-light:#ede9fe;
  --green:#059669; --green-light:#d1fae5;
  --red:#dc2626; --red-light:#fee2e2;
  --bg:#f5f3ff; --card:#fff; --text:#1e1b4b; --muted:#6b7280; --border:#e5e7eb;
  --shadow:0 4px 24px rgba(124,58,237,.08);
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
.header { background:linear-gradient(135deg,#7c3aed,#4f46e5); padding:0 40px; height:64px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 2px 12px rgba(124,58,237,.3); }
.logo { color:#fff; font-size:20px; font-weight:700; display:flex; align-items:center; gap:10px; }
.logo-icon { width:32px; height:32px; background:rgba(255,255,255,.2); border-radius:8px; display:grid; place-items:center; }
.avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#a78bfa,#60a5fa); border:2px solid rgba(255,255,255,.4); display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; }

/* blurred background content */
.bg-content { max-width:900px; margin:0 auto; padding:36px 24px; filter:blur(3px); pointer-events:none; opacity:.5; }
.panel { background:var(--card); border-radius:16px; padding:28px; box-shadow:var(--shadow); border:1px solid var(--border); }
.panel-title { font-size:17px; font-weight:700; margin-bottom:20px; }
.tx-row { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
.tx-icon { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; font-size:16px; flex-shrink:0; }
.tx-info { flex:1; }
.tx-name { font-size:14px; font-weight:600; }
.tx-meta { font-size:12px; color:var(--muted); margin-top:2px; }
.tx-amount { font-size:14px; font-weight:700; }
.plus { color:var(--green); }
.minus { color:var(--red); }
.badge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:20px; }
.badge.food { background:#fef9c3; color:#854d0e; }
.badge.income { background:var(--green-light); color:#065f46; }
.badge.housing { background:#fce7f3; color:#9d174d; }

/* overlay */
.overlay {
  position:fixed; inset:0;
  background:rgba(15,10,40,.55);
  backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  z-index:100;
}
.modal {
  background:#fff;
  border-radius:24px;
  padding:36px 40px;
  width:480px;
  max-width:95vw;
  box-shadow:0 24px 64px rgba(0,0,0,.25);
  position:relative;
}
.modal-close { position:absolute; top:20px; right:20px; width:32px; height:32px; border-radius:50%; border:none; background:#f3f4f6; cursor:pointer; font-size:16px; display:grid; place-items:center; color:var(--muted); }
.modal-badge { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600; background:#fff5f5; color:var(--red); border:1px solid #fecaca; margin-bottom:16px; }
.modal-title { font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:6px; }
.modal-sub { font-size:13px; color:var(--muted); margin-bottom:28px; }
.modal-divider { height:1px; background:var(--border); margin:0 -40px 24px; }

.form-group { display:flex; flex-direction:column; gap:7px; margin-bottom:16px; }
.form-group:last-of-type { margin-bottom:0; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
label { font-size:12px; font-weight:700; color:var(--text); letter-spacing:.2px; text-transform:uppercase; }
input, select {
  padding:12px 14px; border:1.5px solid var(--border); border-radius:10px;
  font-size:14px; font-family:inherit; color:var(--text); background:#fafafa; outline:none;
}
input:focus, select:focus { border-color:var(--purple); background:#fff; box-shadow:0 0 0 3px rgba(124,58,237,.1); }
.amount-input { border-color:#fca5a5; background:#fff5f5; }
.modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:24px; }
.btn-cancel { padding:13px; border:1.5px solid var(--border); border-radius:12px; background:#fff; font-size:14px; font-weight:600; cursor:pointer; color:var(--muted); font-family:inherit; }
.btn-save { padding:13px; border:none; border-radius:12px; background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px rgba(124,58,237,.3); }
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">💰</div>ExpenseTracker</div>
  <div class="avatar">AJ</div>
</div>

<!-- blurred background -->
<div class="bg-content">
  <div class="panel">
    <div class="panel-title">Recent Transactions</div>
    <div class="tx-row"><div class="tx-icon" style="background:#fef9c3">🛒</div><div class="tx-info"><div class="tx-name">Weekly Groceries</div><div class="tx-meta"><span class="badge food">Food</span> · Apr 9</div></div><div class="tx-amount minus">-$127.40</div></div>
    <div class="tx-row"><div class="tx-icon" style="background:#d1fae5">💰</div><div class="tx-info"><div class="tx-name">Monthly Salary</div><div class="tx-meta"><span class="badge income">Income</span> · Apr 1</div></div><div class="tx-amount plus">+$4,800.00</div></div>
    <div class="tx-row" style="border:none"><div class="tx-icon" style="background:#fce7f3">🏠</div><div class="tx-info"><div class="tx-name">Apartment Rent</div><div class="tx-meta"><span class="badge housing">Housing</span> · Apr 1</div></div><div class="tx-amount minus">-$1,200.00</div></div>
  </div>
</div>

<!-- modal overlay -->
<div class="overlay">
  <div class="modal">
    <button class="modal-close">✕</button>
    <div class="modal-badge">✏ Editing</div>
    <div class="modal-title">Edit Transaction</div>
    <div class="modal-sub">Update the details for this entry</div>
    <div class="modal-divider"></div>

    <div class="form-group">
      <label>Description</label>
      <input type="text" value="Weekly Groceries"/>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Amount</label>
        <input type="number" class="amount-input" value="-127.40" step="0.01"/>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" value="2026-04-09"/>
      </div>
    </div>
    <div class="form-group">
      <label>Category</label>
      <select>
        <option selected>Food</option>
        <option>Transport</option>
        <option>Housing</option>
        <option>Entertainment</option>
        <option>Health</option>
        <option>Shopping</option>
        <option>Income</option>
        <option>Other</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel">Cancel</button>
      <button class="btn-save">💾 Save Changes</button>
    </div>
  </div>
</div>
</body>
</html>
